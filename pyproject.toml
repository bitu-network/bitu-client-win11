[project]
name = "bitu"
version = "0.1.0"
requires-python = ">=3.8"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "src_rust_core/Cargo.toml"
module-name = "rust_core"


[tool.ruff.lint]
ignore = [
    "S110",    # try-except-pass (often fine for quiet background hotkeys)
    "PLW1510", # subprocess-run-without-check
]